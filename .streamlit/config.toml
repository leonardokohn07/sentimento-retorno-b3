# Configuração do Streamlit — projeto InvestAI
#
# fileWatcherType = "none"
#   O vigia de arquivos do Streamlit percorre todos os módulos carregados em
#   memória procurando alterações. Quando a biblioteca `transformers` está
#   carregada (ao marcar "Usar modelo NLP"), essa varredura dispara o
#   carregamento preguiçoso de centenas de submódulos dela, e cada um tenta
#   importar o `torch`. Nesta máquina o torch falha ao carregar a DLL c10.dll
#   (WinError 1114), gerando uma avalanche de erros no terminal.
#
#   Desligar o vigia elimina o problema. O custo é que alterações no código
#   passam a exigir reinício manual do servidor — o que já era necessário
#   para mudanças dentro de modulos/.

[server]
fileWatcherType = "none"

[browser]
gatherUsageStats = false


# ─────────────────────────────────────────────────────────
# TEMA
# ─────────────────────────────────────────────────────────
# As mesmas cores de modulos/visual.py. Aqui ficam as do chrome do
# Streamlit (botões, seletores, fundo); lá ficam as dos dados e dos textos.
# Azul #2a78d6 e laranja #eb6834 foram validados para daltonismo e contraste
# sobre fundo branco.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f7f5"
textColor = "#111318"
font = "sans serif"
